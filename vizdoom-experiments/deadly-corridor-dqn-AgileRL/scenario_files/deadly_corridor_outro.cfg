# deadly_corridor.wad + delayed Exit_Normal after vest pickup or death.
# Rendering MUST match VizdoomDeadlyCorridor-v1 (scenarios/deadly_corridor.cfg).
# HUD on here would shift pixels the same way it broke basic_outro eval.
doom_scenario_path = deadly_corridor_outro.wad

# Skill 5 is reccomanded for the scenario to be a challenge.
doom_skill = 5

# Rewards
death_penalty = 100

# Rendering options
screen_resolution = RES_320X240
render_hud = false
render_screen_flashes = false
render_crosshair = false
render_weapon = true
window_visible = false

# Make episodes start in the first tic
episode_start_time = 1

# 2100 tics like deadly_corridor, plus ~50 tics of post-end outro in the ACS.
episode_timeout = 2150

available_buttons =
	{
		MOVE_LEFT
		MOVE_RIGHT
		ATTACK
		MOVE_FORWARD
		MOVE_BACKWARD
		TURN_LEFT
		TURN_RIGHT
	}

available_game_variables = { HEALTH }

mode = PLAYER
