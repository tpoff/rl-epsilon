# defend_the_line map, plus MOVE_LEFT and MOVE_RIGHT so Doomguy can sidestep.
# Same death outro as defend_the_line_outro: the episode freezes after death
# long enough for the weapon to lower and the view to sink to the floor.
# Rendering matches VizdoomDefendTheLine-v1 (HUD off) apart from the extra buttons.
doom_scenario_path = defend_the_line_strafe.wad
doom_skill = 3

death_penalty = 1

screen_resolution = RES_320X240
render_hud = false
render_crosshair = false
render_weapon = true
window_visible = false

episode_start_time = 10

available_buttons =
	{
		MOVE_LEFT
		MOVE_RIGHT
		TURN_LEFT
		TURN_RIGHT
		ATTACK
	}

available_game_variables = { AMMO2 HEALTH }

mode = PLAYER
