# basic.wad + delayed Exit_Normal so the cacodemon death anim can play.
# Rendering MUST match VizdoomBasic-v1 (scenarios/basic.cfg). The agent is a
# CNN over pixels: turning the HUD on here is enough to collapse a trained
# policy to "never attack".
doom_scenario_path = basic_outro.wad
doom_map = map01

living_reward = -1

screen_resolution = RES_320X240
render_hud = false
render_crosshair = false
render_weapon = true
render_decals = true
render_particles = true
window_visible = false

episode_start_time = 14
# 300 tics like basic, plus ~50 tics of post-kill outro in the ACS.
episode_timeout = 350

available_buttons =
	{
		MOVE_LEFT
		MOVE_RIGHT
		ATTACK
	}

available_game_variables = { AMMO2 }

mode = PLAYER
doom_skill = 5
